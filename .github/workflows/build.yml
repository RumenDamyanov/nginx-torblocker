name: Build and Test Nginx TorBlocker

# Smoke-compile on the GitHub runner. Distro and architecture coverage
# (Debian, Ubuntu, Fedora, openSUSE, x86_64 and aarch64) is the OBS
# project home:rumenx. The previous jammy/noble matrix ran on the
# runner itself, so it did not build those releases.

permissions:
  contents: read

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NGINX_VERSION: "1.28.0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # Ubuntu 26.04 dropped libpcre3-dev. nginx 1.28 uses PCRE2.
          sudo apt-get install -y build-essential wget gcc libpcre2-dev zlib1g-dev libssl-dev ca-certificates file

      - name: Download and extract Nginx source
        run: |
          set -euxo pipefail
          wget -nv "https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz"
          tar xzf "nginx-${NGINX_VERSION}.tar.gz"

      - name: Build dynamic module with Nginx source
        run: |
          set -euxo pipefail
          cd "nginx-${NGINX_VERSION}"
          ./configure \
            --add-dynamic-module="$GITHUB_WORKSPACE/src" \
            --with-http_ssl_module \
            --with-compat
          make modules -j"$(nproc)"
          file "objs/ngx_http_torblocker_module.so"
          # The HTTPS client must be in the module, not compiled out.
          nm -D "objs/ngx_http_torblocker_module.so" | grep -q SSL_CTX_set_verify
